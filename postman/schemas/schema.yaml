openapi: 3.0.0
info:
  version: '1.0.0'
  title: 'App Euler Tools'
servers:
  - url: 'localhost:3000'
tags:
  - name: Tokens
  - name: Marketplace
  - name: Subscriptions
  - name: Portfolios
  - name: Wallets
  - name: Addresses
  - name: Transactions
  - name: Trades
paths:
  /bsc/tokens:
    post:
      summary: 'All Tokens'
      operationId: getAllTokens
      description: 'Returns all tokens available in the network,currently, BNB and Ethereum are the availables networks.'
      tags:
        - Tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {
   "query": {
      "bool": {
         "must": [
            {
               "terms": {
                  "category": [
                     "token"
                  ]
               }
            },
            {
               "exists": {
                  "field": "coin"
               }
            }
         ]
      }
   },
   "size": 16,
   "from": 0,
   "sort": [
      {
         "update_date": {
            "order": "desc"
         }
      },
      {
         "market_cap": {
            "order": "desc"
         }
      }
   ],
   "_source": [
      "name",
      "symbol",
      "address",
      "price_usd",
      "price_changes",
      "market_cap",
      "identifier"
   ]
}
      responses:
        '200':
          description: 'Object containing all tokens available.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokens'
  /bsc/tokens/{token}:
    get:
      summary: 'Token'
      operationId: getToken
      description: 'Retrieves token details given a token address'
      tags:
        - Tokens
      parameters:
        - name: token
          in: path
          description: 'Token address to retrieve the most current data'
          required: true
          schema:
            type: string
            example: "0x7130d2a12b9bcbfae4f2634d864a1ee1ce3ead9c"
        - name: fields\[\] 
          in: query
          description: 'Currency'
          required: true
          schema:
             type: string
             example: "price_usd"
      responses:
        '200':
          description: 'Object containing most current data of a given token address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token'      
  /bsc/transactions:
    get:
      summary: 'Transactions'
      operationId: getTransactions
      description: 'Retrieves all transactions given a token address'
      tags:
        - Transactions
      parameters:
        - name: $or[from_address]
          in: query
          description: 'Sender address'
          required: true
          schema:
            type: string
            example: "0x3920123482070c1a2dff73aad695c60e7c6f6862"
        - name: $or[to_address]
          in: query
          description: 'Receiver address'
          required: true
          schema:
            type: string
            example: "0x06012c8cf97bead5deae237070f9587f8e7a266d"
        - name: $sort[block_timestamp]
          in: query
          description: 'Block Timestamp'
          required: true
          schema:
            type: string
            example: "-1%20%20%20%20%20%20"
        - name: $limit
          in: query
          description: 'The limit to retrieve data'
          required: true
          schema:
            type: integer
            format: int32
            example: 16
        - name: $skip
          in: query
          description: 'The number of skipped results'
          required: true
          schema:
            type: integer
            format: int32
            example: 0
      responses:
        '200':
          description: 'Object containing all transactions of a given token address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transactions'
  /bsc/addresses/{address}:
    get:
      summary: 'Addresses'
      operationId: getAddress
      description: 'Returns all tokens related to a specific address'
      tags:
        - Address
      parameters:
        - name: address
          in: path
          description: 'The address to retrieve data'
          required: true
          schema:
            type: string
            example: "0x3920123482070C1a2dff73AaD695c60e7c6F6862"
      responses:
        '200':
          description: 'Object containing tokens related to a specific address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/addresses'
  /bsc/marketplace/{identifier}:
    get:
      summary: 'Single Sale'
      description: Returns details of a single sale given an identifier.
      operationId: getSingleSale
      tags:
        - Marketplace
      parameters:
        - name: identifier
          in: path
          description: "Sale ID"
          required: true
          schema:
            type: string
            example: "121"
      responses:
        '200':
          description: 'Object containing details of a single sale given an identifier'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/singular_sale'
  /bsc/subscription_settings:
    get:
      summary: 'Subscriptions'
      description: Returns all subscription tiers
      operationId: getSubscriptions
      tags:
        - Subscriptions
      responses:
        '200':
          description: 'Array containing subscription settings'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriptions'
  /bsc/accounts/me:
    get:
      summary: 'Profiles'
      description: Returns account details.
      operationId: getProfiles
      tags:
        - Subscriptions
      responses:
        '200':
          description: 'Object containing account information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profiles'
  /bsc/portfolios:
    post:
      summary: 'Creates a portfolio'
      description: Creates a new portfolio with the given name.
      operationId: createPortfolio
      tags:
        - Portfolios
      parameters:
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://euler.tools
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: same-site
        - name: sec-fetch-mode
          in: header
          description: "Mode"
          required: true
          schema:
            type: string
            example: cors
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://euler.tools/
        - name: accept-language
          in: header
          description: "Language"
          required: true
          schema:
            type: string
            example: es-ES,es;q=0.9
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {"name": "portfolio1"}
      responses:
        '201':
          description: 'Object containing information of a new portfolio'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolios'
    get:
      summary: 'Get portfolios'
      description: Retrieves portfolios of an account user.
      operationId: getPortfolios
      tags:
        - Portfolios
      parameters:
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://euler.tools
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: same-site
        - name: sec-fetch-mode
          in: header
          description: "Mode"
          required: true
          schema:
            type: string
            example: cors
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://euler.tools/
        - name: accept-language
          in: header
          description: "Language"
          required: true
          schema:
            type: string
            example: es-ES,es;q=0.9
        - name: authorization
          in: header
          description: "Bearer token"
          required: true
          schema:
            type: string
            example: eyJraWQiOiI5TU9ScXNlMDhhY1N0S25KVXFTV1RZc0hIMUhnWlJ2ZFRkM3k5eFlEZ1wvMD0iLC
      responses:
        '200':
          description: 'Object containing portfolios of a account user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get_portfolios'
  /bsc/wallets:
    post:
      summary: 'Creates a wallet'
      description: Creates a new wallet with given name and address.
      operationId: createWallet
      tags:
        - Wallets
      parameters:
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: bsc.catalog.prod.euler.tools
        - name: accept
          in: header
          description: "Accepted formats"
          required: true
          schema:
            type: string
            example: "application/json, text/plain, */*"
        - name: content-type
          in: header
          description: "Type"
          required: true
          schema:
            type: string
            example: application/json
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://euler.tools
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: same-site
        - name: sec-fetch-dest
          in: header
          description: "sec-fetch-site"
          required: true
          schema:
            type: string
            example: empty
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://euler.tools/
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {
   "address": "0xE7c5F631457e38cAa5d006e10936CDBDF41d3273",
   "name": "Wallet1"
}
      responses:
        '200':
          description: 'Object containing details of a new wallet'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallets'
    get:
      summary: 'Get wallets'
      description: Returns wallets information.
      operationId: getWallet
      tags:
        - Wallets
      responses:
        '200':
          description: 'Array containing wallets details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
  /bsc/wallets/{id}:
    delete:
      summary: 'Deletes a wallet'
      description: Deletes a wallet by the given identifier.
      operationId: deleteWallet
      tags:
        - Wallets
      parameters:
        - name: id
          in: path
          description: "identifier"
          required: true
          schema:
            type: string
            example: ba4b79ea-541e-4612-93ce-fd0994f171e1
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: bsc.catalog.prod.euler.tools
        - name: accept
          in: header
          description: "Accepted formats"
          required: true
          schema:
            type: string
            example: "application/json, text/plain, */*"
        - name: content-type
          in: header
          description: "Type"
          required: true
          schema:
            type: string
            example: application/json
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://euler.tools
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: same-site
        - name: sec-fetch-dest
          in: header
          description: "sec-fetch-site"
          required: true
          schema:
            type: string
            example: empty
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://euler.tools/
      responses:
        '200':
          description: 'Object with metadata information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_delete'
    put:
      summary: 'Updates a wallet'
      description: Updates an existing wallet by the given wallet identifier.
      operationId: updatesWallet
      tags:
        - Wallets
      parameters:
        - name: id
          in: path
          description: "Wallet identifier"
          required: true
          schema:
            type: string
            example: "43e82635-de5e-4441-858d-4be09b9e66a1"
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: "bsc.catalog.prod.euler.tools"
        - name: content-type
          in: header
          description: "Type"
          required: true
          schema:
            type: string
            example: "application/json"
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: "https://euler.tools"
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: "same-site"
        - name: sec-fetch-dest
          in: header
          description: "fetch"
          required: true
          schema:
            type: string
            example: "empty"
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: "https://euler.tools/"
        - name: accept-language
          in: header
          description: ""
          required: true
          schema:
            type: string
            example: "es-ES,es;q=0.9"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {
   "address": "0xE7c5F631457e38cAa5d006e10936CDBDF41d3273",
   "name": "New_wallet"
}
      responses:
        '200':
          description: 'Object with updated wallet details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_update'
  /bsc/trades:
    get:
      summary: 'Trades'
      operationId: getTrades
      description: 'Returns all trades of a specific token'
      tags:
        - App
      parameters:
        - name: address
          in: query
          description: "The address to retrieve trade information"
          required: true
          schema:
            type: string
            example: "0x31045e7023e6c388f9447e632a3f9eaff90393fa"
        - name: $sort[block_timestamp]
          in: query
          description: "Sort"
          required: true
          schema:
            type: integer
            format: int32
            example: -1
        - name: $limit
          in: query
          description: "The limit to retrieve data"
          required: true
          schema:
            type: integer
            format: int32
            example: 10
        - name: $skip
          in: query
          description: "The number of skipped results"
          required: true
          schema:
            type: integer
            format: int32
            example: 0
        - name: block_timestamp[$gte]
          in: query
          description: "Block timestamp"
          required: true
          schema:
            type: string
            example: "2021-10-01T03:00:00.000Z"
        - name: block_timestamp[$lte]
          in: query
          description: "Block timestamp"
          required: true
          schema:
            type: string
            example: "2021-12-31T03:00:00.000Z"
        - name: volume[$gte]
          in: query
          description: "Volume"
          required: true
          schema:
            type: integer
            format: int32
            example: 0
      responses:
        '200':
          description: 'Array containig all trades information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App_trades'
  /bsc/portfolios/{id}:
    put:
      summary: 'Updates a portfolio'
      description: Updates a portfolio by the given portfolio identifier.
      operationId: updatePortfolio
      tags:
        - Portfolios
      parameters:
        - name: id
          in: path
          description: "Portfolio identifier"
          required: true
          schema:
            type: string
            example: "43e82635-de5e-4441-858d-4be09b9e66a1"
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: "bsc.catalog.prod.euler.tools"
        - name: accept
          in: header
          description: "Accepted formats"
          required: true
          schema:
            type: string
            example: "application/json, text/plain, */*"
        - name: content-type
          in: header
          description: "Type"
          required: true
          schema:
            type: string
            example: "application/json"
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: "https://euler.tools"
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: "same-site"
        - name: sec-fetch-dest
          in: header
          description: "fetch"
          required: true
          schema:
            type: string
            example: "empty"
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: "https://euler.tools/"
        - name: accept-language
          in: header
          description: ""
          required: true
          schema:
            type: string
            example: "es-ES,es;q=0.9"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {"name": "new_portfolio"}
      responses:
        '200':
          description: 'Object with updates details of a specific portfolio.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portfolios_update'
    delete:
      summary: 'Deletes a portfolio'
      description: Deletes a portfolio with the given portfolio identifier.
      operationId: deletePortfolio
      tags:
        - Portfolios
      parameters:
        - name: id
          in: path
          description: "Portfolio id"
          required: true
          schema:
            type: string
            example: "43e82635-de5e-4441-858d-4be09b9e66a1"
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: cognito-idp.us-east-1.amazonaws.com
        - name: accept
          in: header
          description: "Accepted formats"
          required: true
          schema:
            type: string
            example:  "*/*"
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: "https://euler.tools"
        - name: sec-fetch-site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: "same-site"
        - name: sec-fetch-dest
          in: header
          description: "fetch"
          required: true
          schema:
            type: string
            example: "empty"
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: "https://euler.tools/"
        - name: accept-language
          in: header
          description: ""
          required: true
          schema:
            type: string
            example: "es-ES,es;q=0.9"
      responses:
        '200':
          description: 'Object with metadata information'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portfolios_delete'
  /bsc/marketplace:
    post:
      summary: 'Search Sales'
      description: Returns all sales in the network.
      operationId: getSales
      tags:
        - Marketplace
      parameters:
        - name: User-Agent
          in: header
          description: "User-Agent"
          required: true
          schema:
            type: string
            example: Mozilla/5.0 (X11; Linux x86_64; rv:97.0) Gecko/20100101 Firefox/97.0 
        - name: Accept
          in: header
          description: "Accepted formats"
          required: true
          schema:
            type: string
            example: "application/json, text/plain, */*"
        - name: Accept-Language
          in: header
          description: "Language"
          required: true
          schema:
            type: string
            example: es-ES,es;q=0.9
        - name: Accept-Encoding
          in: header
          description: "Encoding"
          required: true
          schema:
            type: string
            example: gzip, deflate, br
        - name: Authorization
          in: header
          description: "Auth"
          required: true
          schema:
            type: string
            example: 234FFnnweo$as
        - name: Origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://development.euler.tools
        - name: Connection
          in: header
          description: "Connection"
          required: true
          schema:
            type: string
            example: keep-alive
        - name: Referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://development.euler.tools/
        - name: Sec-Fetch-Dest
          in: header
          description: "Dest"
          required: true
          schema:
            type: string
            example: empty
        - name: Sec-Fetch-Mode
          in: header
          description: "Mode"
          required: true
          schema:
            type: string
            example: cors
        - name: Sec-Fetch-Site
          in: header
          description: "Site"
          required: true
          schema:
            type: string
            example: same-site
        - name: If-None-Match
          in: header
          description: "If-None-Match"
          required: true
          schema:
            type: string
            example: W/"3834-NvE892Xn4t86xhz9UBxKYB0i3qY"
        - name: TE
          in: header
          description: "trailers"
          required: true
          schema:
            type: string
            example: trailers
        - name: content-type
          in: header
          description: "Type"
          required: true
          schema:
            type: string
            example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  example: {
   "size": 16,
   "from": 0,
   "sort": [
      {
         "create_date": {
            "order": "desc"
         }
      }
   ],
   "query": {
      "bool": {
         "must": [
            {
               "terms": {
                  "kind": [
                     0,
                     2
                  ]
               }
            },
            {
               "terms": {
                  "blockchain": [
                     "bsc"
                  ]
               }
            },
            {
               "range": {
                  "close_date": {
                     "lte": 1
                  }
               }
            }
         ]
      }
   }
}
      responses:
        '200':
          description: 'Object containing all sales in the network'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sales'
  /bsc/pools/{poolAddress}:
    get:
      summary: 'Pools'
      operationId: getPool
      description: 'Ethereum Node'
      tags:
        - Subscriptions
      parameters:
        - name: poolAddress
          in: path
          description: "Pool address"
          required: true
          schema:
            type: string
            example: "0xda98731d7Ca75bbf22FD1251d8B1dC6053018129"
        - name: authority
          in: header
          description: "Domain"
          required: true
          schema:
            type: string
            example: bsc.catalog.prod.euler.tools
        - name: accept-language
          in: header
          description: "Language"
          required: true
          schema:
            type: string
            example: es-ES,es;q=0.9
        - name: if-none-match
          in: header
          description: "If-None-Match"
          required: true
          schema:
            type: string
            example: W/"136-558bl8ctwzKZVjtsrNVsL03Il68"
        - name: origin
          in: header
          description: "Server"
          required: true
          schema:
            type: string
            example: https://euler.tools
        - name: referer
          in: header
          description: "Referer"
          required: true
          schema:
            type: string
            example: https://euler.tools/
        - name: sec-ch-ua-mobile
          in: header
          description: "Mode"
          required: true
          schema:
            type: string
            example: ?0
        - name: sec-ch-ua-platform
          in: header
          description: "Mode"
          required: true
          schema:
            type: string
            example: "Windows"
        - name: sec-fetch-dest
          in: header
          description: "sec-fetch-site"
          required: true
          schema:
